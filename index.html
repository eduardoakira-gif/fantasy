<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy R6 · SAL 2026 Stage 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#EEF1F5;--surface:#fff;--surface-2:#F4F6F9;--line:#D6DCE5;--text:#162131;--muted:#5B6878;--accent:#B97C05;--accent-soft:rgba(201,138,11,.14);--on-accent:#1A1306;--up:#0E8F71;--down:#C93C33;--chip:#E4E9F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131B27;--surface:#1B2535;--surface-2:#223045;--line:#2F3D54;--text:#E9EEF5;--muted:#93A1B5;--accent:#F2B134;--accent-soft:rgba(242,177,52,.14);--on-accent:#1A1306;--up:#3DD6B0;--down:#FF7A6E;--chip:#26344B}}
:root[data-theme="dark"]{--bg:#131B27;--surface:#1B2535;--surface-2:#223045;--line:#2F3D54;--text:#E9EEF5;--muted:#93A1B5;--accent:#F2B134;--accent-soft:rgba(242,177,52,.14);--on-accent:#1A1306;--up:#3DD6B0;--down:#FF7A6E;--chip:#26344B}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.c{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{width:30px;height:30px;background:var(--accent);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:var(--on-accent);font:700 15px "Barlow Condensed"}
.brand b{font:700 22px/1 "Barlow Condensed";letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
nav.desk{display:none;gap:4px;margin-left:auto}
nav a{text-decoration:none;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:600}
nav a.on{color:var(--text);background:var(--surface-2)}
nav.mob{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.mob a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;border-radius:0}
nav.mob a svg{width:22px;height:22px}nav.mob a.on{background:none;color:var(--accent)}
@media(min-width:860px){nav.desk{display:flex}nav.mob{display:none}.wrap{padding-bottom:48px}}
.theme-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;color:var(--muted)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:clamp(30px,6vw,46px)}h2{font-size:24px;margin:28px 0 12px}h3{font-size:18px}
.muted{color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.notice{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:4px;margin:16px 0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-family:"Barlow Condensed";font-size:18px;letter-spacing:.3px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{padding:6px 10px;font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:1fr}@media(min-width:720px){.g3{grid-template-columns:repeat(3,1fr)}}
/* hero */
.hero{position:relative;margin:20px 0 8px;padding:22px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border:28px solid var(--accent-soft);transform:rotate(45deg)}
.hero .stage{font-weight:600;color:var(--muted)}
.count{display:flex;gap:10px;margin:14px 0 18px;position:relative;z-index:1}
.count div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:62px;text-align:center}
.count b{display:block;font:700 30px/1 "Barlow Condensed"}.count span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:700 28px/1.1 "Barlow Condensed"}.kpi span{font-size:13px;color:var(--muted)}
/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row:last-child{border-bottom:0}.row .grow{flex:1;min-width:0}.row .num{font:700 18px "Barlow Condensed";min-width:52px;text-align:right}
.pos{width:22px;color:var(--muted);font:600 15px "Barlow Condensed"}
.ava{flex:none;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.badge{flex:none;display:inline-grid;place-items:center;font:700 11px/1 "Barlow Condensed";background:var(--chip);color:var(--text);clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%)}
.ava.ph{background:linear-gradient(180deg,var(--surface-2),var(--chip))}.ava img{display:block;width:100%;height:100%;object-fit:cover}
.tlogo{flex:none;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;overflow:hidden}.tlogo img{width:100%;height:100%;object-fit:contain;display:block}.tlogo .lg-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tlogo .lg-l{display:none}:root:not([data-theme="light"]) .tlogo .lg-d{display:block}}
:root[data-theme="dark"] .tlogo .lg-l{display:none}:root[data-theme="dark"] .tlogo .lg-d{display:block}
.ctag{display:inline-block;font:700 11px/1 "Barlow Condensed";letter-spacing:.6px;text-transform:uppercase;padding:3px 6px;border-radius:3px;background:var(--text);color:var(--bg);vertical-align:middle}
.slot.coach{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.slot.coach.empty{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 12px}.seg button{border:0;background:var(--surface);padding:8px 16px;font-weight:700;cursor:pointer}.seg button.on{background:var(--text);color:var(--bg)}
.contrib{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}.contrib .b{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:8px}.contrib .b i{display:block;height:100%;background:var(--accent)}
.nick{font-weight:700}.sub{font-size:12px;color:var(--muted)}
/* mercado */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
@media(min-width:860px){.filters{grid-template-columns:2fr 1fr 1fr 1fr 1fr}}
.filters input,.filters select,.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.filters .search{grid-column:1/-1}@media(min-width:860px){.filters .search{grid-column:auto}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);padding:14px 12px 12px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));display:flex;flex-direction:column;gap:8px}
.pcard.sel{background:var(--accent-soft);border-color:var(--accent)}
.pcard .head{display:flex;gap:10px;align-items:center;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.pcard .price{font:700 30px/1 "Barlow Condensed"}.pcard .price small{font-size:14px;color:var(--muted);font-weight:600}
.pcard dl{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0;font-size:12px}.pcard dt{color:var(--muted)}.pcard dd{margin:0;font:700 16px "Barlow Condensed"}
.delta{font:700 14px "Barlow Condensed"}
/* time */
.budget{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.budget div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.budget b{display:block;font:700 26px/1 "Barlow Condensed"}.budget span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--down)}
.squad{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:720px){.squad{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.squad{grid-template-columns:repeat(6,1fr)}}
.slot{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;align-items:center;gap:12px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
@media(min-width:720px){.slot{flex-direction:column;text-align:center;padding:18px 10px}}
.slot.empty{border-style:dashed;color:var(--muted);justify-content:center;min-height:84px;text-decoration:none}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cap{font:700 12px "Barlow Condensed";background:var(--accent);color:var(--on-accent);padding:2px 7px;border-radius:3px}
.errs{margin:12px 0;padding:0;list-style:none}.errs li{color:var(--down);font-size:14px}
/* tabelas */
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.complete{background:var(--up)}.dot.pending_import{background:var(--accent)}.dot.scheduled{background:var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--chip);color:var(--muted)}
.tag.warn{background:var(--accent-soft);color:var(--accent)}.tag.err{color:var(--down)}.tag.ok{color:var(--up)}
details.match{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface)}
details.match>summary{cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center;list-style:none}
details.match>summary::-webkit-details-marker{display:none}
details.match>summary .grow{flex:1;min-width:0}
details.match .body{padding:0 12px 12px}
.calc{font-size:13px;background:var(--surface-2);border-radius:6px;padding:10px;margin:6px 0}
.calc td{padding:2px 8px 2px 0}.calc .tot td{border-top:1px solid var(--line);font-weight:700;padding-top:6px}
/* perfil */
.profile-head{display:flex;gap:16px;align-items:center;margin:20px 0}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:720px){.statgrid{grid-template-columns:repeat(6,1fr)}}
.statgrid div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.statgrid b{display:block;font:700 22px/1.1 "Barlow Condensed"}.statgrid span{font-size:12px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:10px;height:120px;padding:10px 0}
.spark div{flex:1;max-width:56px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.spark i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}.spark i.neg{background:var(--down)}
.spark span{font-size:12px;color:var(--muted)}.spark b{font:700 14px "Barlow Condensed"}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.weights{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:720px){.weights{grid-template-columns:repeat(5,1fr)}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:50}
@media (prefers-reduced-motion:no-preference){.pcard,.btn{transition:background .15s,border-color .15s}}
</style></head><body>

      imp.maps.forEach(mp => maps.push({ ...mp, match_id: imp.match_id }));

      m.imported = true; m.import_source = imp.source || 'Importação manual (admin)';
    });
    const players = {}, memberships = [];
    raw.slice().sort((a, b) => a.match_id - b.match_id).forEach(s => {
      const id = slug(s.nick); s.player_id = id;
      if (!players[id]) players[id] = { player_id: id, nickname: s.nick, real_name: null, nationality: null, role: null,
        photo_url: null, photo_missing: true, photo_source: null, active: true, source: 'R6 Esports (Ubisoft) — escalação oficial das partidas', updated_at: data.meta.collected_at };
      if (!players[id].photo_url) { const pm = (data.player_media || []).find(x => slug(x.nick) === id && x.team_id === s.team_id);
        if (pm) Object.assign(players[id], { photo_url: pm.photo_url, photo_missing: false, photo_source: pm.source, photo_source_url: pm.source_url }); }
      let mem = memberships.find(x => x.player_id === id && x.team_id === s.team_id);
      if (!mem) memberships.push({ player_id: id, team_id: s.team_id, joined_at: null, first_seen_match: s.match_id, left_at: null,
        source: 'Inferido da escalação oficial na partida ' + s.match_id });
    });
    Object.values(players).forEach(p => {
      const mems = memberships.filter(m => m.player_id === p.player_id);
      p.team_id = mems.length === 1 ? mems[0].team_id : mems.sort((a, b) => b.first_seen_match - a.first_seen_match)[0].team_id;
    });
    return { matches, maps, raw, players, memberships, log };
  }

  /* ---------- 2. validação ---------- */
  function validate(n) {
    const issues = [], ok = new Set();
    n.matches.filter(m => m.imported).forEach(m => {
      if (!PROCESSABLE.has(m.status)) { issues.push({ level: 'error', match: m.id, msg: `Partida ${m.id} está "${m.status}" — não processada.` }); return; }
      const mm = n.maps.filter(x => x.match_id === m.id); let bad = false;
      if (!mm.length) { issues.push({ level: 'error', match: m.id, msg: `Partida ${m.id} sem mapas.` }); bad = true; }
      mm.forEach(mp => {
        const rows = n.raw.filter(s => s.match_id === m.id && s.map_no === mp.map_no);
        const rounds = mp.score_a + mp.score_b;
        [mp.team_a, mp.team_b].forEach(t => {
          const c = rows.filter(r => r.team_id === t).length;
          if (c !== 5) { issues.push({ level: 'error', match: m.id, msg: `Partida ${m.id}, mapa ${mp.map}: equipe ${t} com ${c} jogadores (esperado 5).` }); bad = true; }
        });
        const kA = rows.filter(r => r.team_id === mp.team_a).reduce((s, r) => s + r.kills, 0);
        const dB = rows.filter(r => r.team_id === mp.team_b).reduce((s, r) => s + r.deaths, 0);
        const kB = rows.filter(r => r.team_id === mp.team_b).reduce((s, r) => s + r.kills, 0);
        const dA = rows.filter(r => r.team_id === mp.team_a).reduce((s, r) => s + r.deaths, 0);
        if (Math.abs(kA - dB) > 3 || Math.abs(kB - dA) > 3) issues.push({ level: 'warn', match: m.id, msg: `Partida ${m.id}: kills × mortes adversárias divergem (${kA}/${dB}, ${kB}/${dA}).` });
        if (kA + kB > rounds * 10) { issues.push({ level: 'error', match: m.id, msg: `Partida ${m.id}: kills (${kA + kB}) implausíveis para ${rounds} rounds.` }); bad = true; }
        rows.forEach(r => { if (Math.abs(r.kpr - r.kills / rounds) > 0.02) issues.push({ level: 'warn', match: m.id, msg: `Partida ${m.id}: KPR de ${r.nick} (${r.kpr}) difere de K/rounds (${(r.kills / rounds).toFixed(2)}).` }); });
        if (m.score_a !== mp.score_a || m.score_b !== mp.score_b) issues.push({ level: 'warn', match: m.id, msg: `Partida ${m.id}: placar do mapa difere do calendário.` });
      });
      if (m.data_validity != null && m.data_validity !== 1) issues.push({ level: 'warn', match: m.id, msg: `Partida ${m.id}: a fonte oficial marca os dados com nível de validação ${m.data_validity} (pode haver revisão posterior). Pontuada normalmente.` });
      if (!bad) ok.add(m.id);
    });
    Object.values(n.players).forEach(p => {
      const mems = n.memberships.filter(x => x.player_id === p.player_id && !x.left_at);
      if (mems.length > 1) issues.push({ level: 'error', msg: `${p.nickname} aparece em ${mems.length} equipes ativas sem transferência registrada.` });
    });
    const nicks = {}; Object.values(n.players).forEach(p => { const k = p.nickname.toLowerCase().replace(/[^a-z0-9]/g, ''); (nicks[k] = nicks[k] || []).push(p.nickname); });
    Object.values(nicks).filter(a => new Set(a).size > 1).forEach(a => issues.push({ level: 'warn', msg: `Possível duplicidade de nickname: ${a.join(', ')}` }));
    return { issues, processable: ok };
  }

  /* ---------- 3. scoring ---------- */
  function kostBonus(kost, rules) { for (const t of rules.kost_tiers) if (kost >= t.min) return t.pts; return 0; }
  function scoreMap(s, rules) {
    const items = [
      ['Kills', s.kills, rules.kill], ['Mortes', s.deaths, rules.death], ['Entry kills', s.entry_kills, rules.entry_kill],
      ['Entry deaths', s.entry_deaths, rules.entry_death], ['Clutches', s.clutches, rules.clutch], ['Multikills', s.multikills, rules.multikill],
      ['Objetivos', s.objectives, rules.objective], ['Trade kills', s.trade_kills, rules.trade_kill]
    ].map(([label, qty, w]) => ({ label, qty, w, pts: qty * w }));
    items.push({ label: `Bônus KOST (${s.kost}%)`, qty: null, w: null, pts: kostBonus(s.kost, rules) });
    return { items, total: items.reduce((a, b) => a + b.pts, 0) };
  }

  /* ---------- 4. pipeline completo (Recalculate Fantasy Season) ---------- */
  function run(data, rules, imports, opts) {
    if (rules && (rules.version || 1) < 2) rules = { ...rules, version: 2, max_per_team: DEFAULT_RULES.max_per_team, budget: DEFAULT_RULES.budget }; // v2: coach + até 5 por time
    rules = { ...DEFAULT_RULES, ...(rules || {}) };
    const n = normalize(data, imports), v = validate(n);
    const teams = Object.fromEntries(data.teams.map(t => [t.id, t]));
    const done = n.matches.filter(m => v.processable.has(m.id));
    const rounds = [...new Set(n.matches.map(m => m.round))].sort((a, b) => a - b);
    // por mapa -> por partida
    const playerMatch = []; // {player_id, match_id, round, team_id, opp, won, maps:[{map, stats, score}], base, win, total}
    done.forEach(m => {
      const mps = n.maps.filter(x => x.match_id === m.id).sort((a, b) => a.map_no - b.map_no);
      const winner = m.score_a > m.score_b ? m.team_a : m.team_b;
      const pids = [...new Set(n.raw.filter(s => s.match_id === m.id).map(s => s.player_id))];
      pids.forEach(pid => {
        const rows = n.raw.filter(s => s.match_id === m.id && s.player_id === pid);
        const team = rows[0].team_id; const won = team === winner;
        const mapsScored = rows.map(s => ({ map: mps.find(x => x.map_no === s.map_no).map, map_no: s.map_no, stats: s, score: scoreMap(s, rules) }));
        const base = mapsScored.reduce((a, b) => a + b.score.total, 0);
        const win = won ? rules.victory_bonus : 0;
        playerMatch.push({ player_id: pid, match_id: m.id, round: m.round, team_id: team, opp: team === m.team_a ? m.team_b : m.team_a,
          won, score_str: team === m.team_a ? `${m.score_a}:${m.score_b}` : `${m.score_b}:${m.score_a}`, maps: mapsScored, base, win, total: base + win });
      });
    });
    const teamMatches = {}; done.forEach(m => { [m.team_a, m.team_b].forEach(t => teamMatches[t] = (teamMatches[t] || 0) + 1); });
    // agregados por jogador
    const P = Object.values(n.players).map(p => {
      const ms = playerMatch.filter(x => x.player_id === p.player_id).sort((a, b) => a.match_id - b.match_id);
      const tot = k => ms.reduce((s, x) => s + x.maps.reduce((a, mp) => a + mp.stats[k], 0), 0);
      const mapsN = ms.reduce((s, x) => s + x.maps.length, 0);
      const roundsPlayed = ms.reduce((s, x) => s + x.maps.reduce((a, mp) => { const M = n.maps.find(z => z.match_id === x.match_id && z.map_no === mp.map_no); return a + M.score_a + M.score_b; }, 0), 0);
      const avgW = k => mapsN ? ms.reduce((s, x) => s + x.maps.reduce((a, mp) => a + mp.stats[k], 0), 0) / mapsN : null;
      const pts = ms.map(x => x.total);
      const byRound = {}; ms.forEach(x => byRound[x.round] = (byRound[x.round] || 0) + x.total);
      const K = tot('kills'), D = tot('deaths');
      return { ...p, team: teams[p.team_id], matches: ms, games: ms.length, maps_played: mapsN, rounds_played: roundsPlayed,
        total: pts.reduce((a, b) => a + b, 0), avg: mean(pts), form: mean(pts.slice(-rules.form_window)), sd: sd(pts), byRound,
        availability: teamMatches[p.team_id] ? ms.length / teamMatches[p.team_id] : 0,
        stats: { kills: K, deaths: D, kd: D ? K / D : K, entry_kills: tot('entry_kills'), entry_deaths: tot('entry_deaths'),
          kost: avgW('kost'), kpr: roundsPlayed ? K / roundsPlayed : 0, hs: avgW('hs'), srv: avgW('srv'), clutches: tot('clutches'),
          multikills: tot('multikills'), objectives: tot('objectives'), trade_kills: tot('trade_kills'), dead_for_trade: tot('dead_for_trade'), eps: avgW('eps') } };
    });
    // coaches: nota = soma dos FP dos jogadores do time na partida ÷ tamanho do elenco (5)
    const coachesSrc = (data.coaches || []).map(c => ({ ...c, kind: 'coach' }));
    const coachOf = (tid, iso) => coachesSrc.find(c => c.team_id === tid && (!c.joined_at || c.joined_at <= iso) && (!c.left_at || c.left_at > iso));
    const coachMatch = [];
    done.forEach(m => {
      const winner = m.score_a > m.score_b ? m.team_a : m.team_b;
      [m.team_a, m.team_b].forEach(tid => {
        const c = coachOf(tid, m.start); if (!c) return;
        const rows = playerMatch.filter(x => x.match_id === m.id && x.team_id === tid).sort((a, b) => b.total - a.total);
        const sum = rows.reduce((s, x) => s + x.total, 0);
        coachMatch.push({ coach_id: c.coach_id, match_id: m.id, round: m.round, team_id: tid, opp: tid === m.team_a ? m.team_b : m.team_a, won: tid === winner,
          score_str: tid === m.team_a ? `${m.score_a}:${m.score_b}` : `${m.score_b}:${m.score_a}`, players: rows.map(x => ({ player_id: x.player_id, total: x.total })),
          sum, divisor: rules.squad_size, total: sum / rules.squad_size });
      });
    });
    const C = coachesSrc.map(c => {
      const ms = coachMatch.filter(x => x.coach_id === c.coach_id).sort((a, b) => a.match_id - b.match_id);
      const pts = ms.map(x => x.total); const byRound = {}; ms.forEach(x => byRound[x.round] = (byRound[x.round] || 0) + x.total);
      const contrib = {}; ms.forEach(x => x.players.forEach(p => { const o = contrib[p.player_id] = contrib[p.player_id] || { player_id: p.player_id, games: 0, pts: 0 }; o.games++; o.pts += p.total; }));
      const sumAll = ms.reduce((s, x) => s + x.sum, 0);
      const W = ms.filter(x => x.won), L = ms.filter(x => !x.won);
      return { ...c, team: teams[c.team_id], photo_missing: !c.photo_url, matches: ms, games: ms.length, total: pts.reduce((a, b) => a + b, 0), avg: mean(pts),
        form: mean(pts.slice(-rules.form_window)), sd: sd(pts), byRound, availability: teamMatches[c.team_id] ? ms.length / teamMatches[c.team_id] : 0,
        wins: W.length, losses: L.length, avg_win: W.length ? mean(W.map(x => x.total)) : null, avg_loss: L.length ? mean(L.map(x => x.total)) : null,
        best: ms.length ? ms.reduce((a, b) => b.total > a.total ? b : a) : null, worst: ms.length ? ms.reduce((a, b) => b.total < a.total ? b : a) : null,
        contributions: Object.values(contrib).map(o => ({ ...o, avg: o.pts / o.games, share: sumAll ? o.pts / sumAll : 0 })).sort((a, b) => b.pts - a.pts) };
    });
    C.slice().sort((a, b) => b.avg - a.avg).forEach((c, i) => c.rank_avg = i + 1);
    // mercado
    const lastRound = Math.max(0, ...done.map(m => m.round));
    priceWithChange(P, rules, lastRound);
    priceWithChange(C, { ...rules, price_min: rules.coach_price_min, price_max: rules.coach_price_max }, lastRound);
    // rodadas
    const byId = Object.fromEntries(P.map(p => [p.player_id, p]));
    const coachById = Object.fromEntries(C.map(c => [c.coach_id, c]));
    const roundSummaries = rounds.map(r => {
      const ms = n.matches.filter(m => m.round === r);
      const scored = ms.filter(m => v.processable.has(m.id));
      const rows = playerMatch.filter(x => x.round === r);
      const agg = {}; rows.forEach(x => agg[x.player_id] = (agg[x.player_id] || 0) + x.total);
      const ranked = Object.entries(agg).map(([pid, pts]) => ({ player: byId[pid], pts })).sort((a, b) => b.pts - a.pts);
      const cagg = {}; coachMatch.filter(x => x.round === r).forEach(x => cagg[x.coach_id] = (cagg[x.coach_id] || 0) + x.total);
      const coachRanked = Object.entries(cagg).map(([cid, pts]) => ({ coach: coachById[cid], pts })).sort((a, b) => b.pts - a.pts);
      let status = 'scheduled';
      if (scored.length && scored.length === ms.length) status = 'complete';
      else if (scored.length) status = 'partial';
      else if (ms.every(m => m.status === 'finished' || m.status === 'incomplete')) status = 'pending_import';
      return { round: r, matches: ms, scored: scored.length, status, lock: ms.map(m => m.start).sort()[0], ranked,
        avg: mean(ranked.map(x => x.pts)), top: ranked[0] || null, coachRanked, dream: ranked.length ? dreamTeam(ranked, coachRanked, rules) : null };
    });
    return { rules, normalized: n, validation: v, teams, players: P, byId, playerMatch, coaches: C, coachById, coachMatch, rounds: roundSummaries, lastRound,
      imported: n.matches.filter(m => m.imported).length };
  }

  function pctRank(vals) { // rank percentual com empates médios, 0..1
    const idx = vals.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]); const out = new Array(vals.length); let i = 0;
    while (i < idx.length) { let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++; const r = (i + j) / 2; for (let k = i; k <= j; k++) out[idx[k][1]] = vals.length > 1 ? r / (vals.length - 1) : 0.5; i = j + 1; }
    return out;
  }
  function priceWithChange(list, rules, lastRound) {
    priceAll(list, rules);
    if (lastRound > 1) {
      const tmp = list.map(p => { const ms = p.matches.filter(x => x.round < lastRound);
        return { ref: p, games: ms.length, avg: mean(ms.map(x => x.total)), form: mean(ms.slice(-rules.form_window).map(x => x.total)), availability: p.availability }; });
      priceAll(tmp, { ...rules, min_games_for_price: Math.min(rules.min_games_for_price, Math.max(...tmp.map(t => t.games))) });
      tmp.forEach(t => { const pb = t.price; const delta = Math.max(-rules.price_change_cap, Math.min(rules.price_change_cap, t.ref.price - pb)); t.ref.price_before = r1(pb); t.ref.price_change = r1(delta); });
    } else list.forEach(p => { p.price_before = p.price; p.price_change = 0; });
  }
  function priceAll(list, rules, _) {
    const elig = list.filter(p => p.games >= rules.min_games_for_price);
    const norm = (k) => { const vs = elig.map(p => p[k]); const lo = Math.min(...vs), hi = Math.max(...vs); return p => hi > lo ? (p[k] - lo) / (hi - lo) : 0.5; };
    const nA = norm('avg'), nF = norm('form'), nV = norm('availability');
    elig.forEach(p => p.performance_index = rules.w_avg * nA(p) + rules.w_form * nF(p) + rules.w_avail * nV(p));
    const pr = pctRank(elig.map(p => p.performance_index));
    elig.forEach((p, i) => p.price = r1(Math.min(rules.price_max, Math.max(rules.price_min, rules.price_min + (rules.price_max - rules.price_min) * pr[i]))));
    const median = r1((rules.price_min + rules.price_max) / 2);
    list.filter(p => p.games < rules.min_games_for_price).forEach(p => { p.performance_index = null; p.price = median; p.price_conservative = true; });
  }

  /* valorização incremental para rodadas futuras (pós-lançamento) */
  function applyValuation(p, roundPts, rules, allPlayers) {
    const prices = allPlayers.map(x => x.price), avgs = allPlayers.map(x => x.avg);
    const lo = Math.min(...avgs), hi = Math.max(...avgs);
    const expected = lo + (p.price - rules.price_min) / (rules.price_max - rules.price_min) * (hi - lo);
    const signal = 0.5 * (roundPts - expected) + 0.3 * (p.form - expected) + 0.2 * (p.avg - expected);
    const delta = Math.max(-rules.price_change_cap, Math.min(rules.price_change_cap, rules.valuation_k * signal));
    const after = Math.max(rules.price_min, Math.min(rules.price_max, r1(p.price + delta)));
    return { price_before: p.price, price_after: after, price_change: r1(after - p.price), expected: r1(expected) };
  }

  function dreamTeam(ranked, coachRanked, rules) {
    const pool = ranked.slice(0, 20); let best = null;
    const rec = (start, pick) => {
      if (pick.length === rules.squad_size) {
        const pcost = pick.reduce((s, x) => s + x.player.price, 0); if (pcost > rules.budget) return;
        const coach = (coachRanked || []).find(c => pcost + c.coach.price <= rules.budget + 1e-9); if (coachRanked && coachRanked.length && !coach) return;
        const cost = pcost + (coach ? coach.coach.price : 0);
        const tc = {}; for (const x of pick) { tc[x.player.team_id] = (tc[x.player.team_id] || 0) + 1; if (tc[x.player.team_id] > rules.max_per_team) return; }
        const cap = pick.reduce((a, b) => b.pts > a.pts ? b : a);
        const total = pick.reduce((s, x) => s + x.pts, 0) + cap.pts * (rules.captain_multiplier - 1) + (coach ? coach.pts : 0);
        if (!best || total > best.total) best = { picks: pick.slice(), captain: cap.player.player_id, coach: coach || null, total, cost };
        return;
      }
      for (let i = start; i < pool.length; i++) { pick.push(pool[i]); rec(i + 1, pick); pick.pop(); }
    };
    rec(0, []);
    return best;
  }

  /* escalação: validação de regras */
  function checkLineup(ids, captain, S, coachId) {
    const r = S.rules, ps = ids.map(id => S.byId[id]).filter(Boolean), errs = [], coach = coachId ? S.coachById[coachId] : null;
    const cost = ps.reduce((s, p) => s + p.price, 0) + (coach ? coach.price : 0);
    if (ps.length !== r.squad_size) errs.push(`Escale ${r.squad_size} jogadores (faltam ${r.squad_size - ps.length}).`);
    if (new Set(ids).size !== ids.length) errs.push('Jogador repetido.');
    if (cost > r.budget + 1e-9) errs.push(`Orçamento estourado em ${r1(cost - r.budget)}.`);
    const tc = {}; ps.forEach(p => tc[p.team_id] = (tc[p.team_id] || 0) + 1);
    Object.entries(tc).filter(([, c]) => c > r.max_per_team).forEach(([t]) => errs.push(`Máximo de ${r.max_per_team} jogadores da ${S.teams[t].name}.`));
    if (!captain || !ids.includes(captain)) errs.push('Escolha um capitão.');
    if (!coach) errs.push('Escale um coach.');
    return { ok: !errs.length, errs, cost: r1(cost), left: r1(r.budget - cost) };
  }
  function lineupScore(snap, round, S) {
    const rows = snap.players.map(pid => {
      const pts = S.playerMatch.filter(x => x.player_id === pid && x.round === round).reduce((s, x) => s + x.total, 0);
      const isCap = pid === snap.captain;
      return { pid, base: pts, final: isCap ? pts * S.rules.captain_multiplier : pts, isCap };
    });
    const coach = snap.coach ? { cid: snap.coach, pts: S.coachMatch.filter(x => x.coach_id === snap.coach && x.round === round).reduce((s, x) => s + x.total, 0) } : null;
    return { rows, coach, total: rows.reduce((s, x) => s + x.final, 0) + (coach ? coach.pts : 0) };
  }

  /* usuários de demonstração (MOCK — só contas/escalações; stats são reais) */
  function demoUsers(S, count) {
    let seed = 20260905; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const names = ['Breach & Coffee', 'Thermite Gang', 'Clutch Society', 'Pixel Angle', 'Roam Lords', 'Plant Denied', 'Entry Frag FC', 'Kafe Tático',
      'Drone Duty', 'Vertical Play', 'Hard Breach', 'Spawn Peek', 'Defuser Club', 'Ace no Bank', 'Lair Hunters', 'Rotate Now', 'Last Round', 'Trade It',
      'Wall Bang', 'Fortress Five', 'Retake Squad', 'Silent Step', 'Prefire Lab', 'Ninja Defuse'];
    const handles = ['ana.r6', 'bruno_s', 'caio.tt', 'duda', 'enzo.gg', 'fefe', 'gabi.k', 'heitor', 'isa_m', 'joao.p', 'kaue', 'lari', 'mateus.b', 'nina',
      'otavio', 'paula.r', 'quim', 'rafa_l', 'sofi', 'theo.m', 'ugo', 'vivi', 'will.c', 'yasmin'];
    const scored = S.rounds.filter(r => r.status === 'complete' || r.status === 'partial').map(r => r.round);
    const pool = S.players.filter(p => p.games > 0);
    const users = [];
    for (let u = 0; u < Math.min(count, names.length); u++) {
      const lineups = {};
      scored.forEach(r => {
        for (let tries = 0; tries < 500; tries++) {
          const pick = []; const ids = new Set();
          while (pick.length < 5) { const p = pool[Math.floor(rnd() * pool.length)]; if (!ids.has(p.player_id)) { ids.add(p.player_id); pick.push(p.player_id); } }
          const cap = pick[Math.floor(rnd() * 5)], coach = S.coaches[Math.floor(rnd() * S.coaches.length)].coach_id;
          if (checkLineup(pick, cap, S, coach).ok) { lineups[r] = { players: pick, captain: cap, coach, locked_at: S.rounds.find(x => x.round === r).lock, mock: true }; break; }

      <div class="chips">${scored.map(r => `<button class="chip" data-sim="${r.round}">Rodada ${r.round}</button>`).join('')}</div><div id="sim"></div>` : ''}`;
  }
  function resultBlock(snap, round, title) {

    return `<div class="panel"><h3>${title}</h3><div class="c" style="font-size:40px;font-weight:700">${f1(sc.total)} pts</div>
      <div class="list">${sc.rows.slice().sort((a, b) => b.final - a.final).map(x => prow(S.byId[x.pid], `<span class="num">${f1(x.final)}</span>`)).join('')}${sc.coach && S.coachById[sc.coach.cid] ? crow(S.coachById[sc.coach.cid], `<span class="num">${f1(sc.coach.pts)}</span>`) : `<div class="row"><span class="grow muted small">Sem coach nesta escalação</span><span class="num">0,0</span></div>`}</div>
      ${cap ? `<p class="small muted">Capitão: ${esc(S.byId[cap.pid].nickname)} ${f1(cap.base)} → ${f1(cap.final)}</p>` : ''}</div>`;
  }

  let selRound = null;
  function roundsView() {
    const rs = S.rounds; if (selRound == null) selRound = ([...rs].reverse().find(r => r.ranked.length) || rs[0]).round;
    const r = rs.find(x => x.round === selRound);

    const lb = E.leaderboard(USERS, S, r.round);
    const mine = snapshots[r.round];
    return `<h2>Rodadas</h2><div class="chips">${rs.map(x => `<button class="chip ${x.round === selRound ? 'on' : ''}" data-round="${x.round}"><span class="dot ${x.status}"></span>R${x.round}</button>`).join('')}</div>
      <p class="muted">${r.round >= 10 ? 'Playoffs' : 'Fase de grupos · Playday ' + r.round} · ${stLabel[r.status]} · ${dt(r.lock)}</p>

        <div class="grid g2" style="margin-top:12px">${mine ? resultBlock(mine, r.round, 'Sua pontuação') : `<div class="panel"><h3>Sua pontuação</h3><p class="muted">Você não tinha escalação travada nesta rodada.</p></div>`}
        <div class="panel"><h3>Time ideal da rodada</h3><p class="small muted">Melhor combinação de 5 jogadores + coach dentro do orçamento (${S.rules.budget}), com capitão.</p><div class="list">${r.dream.picks.map(x => prow(x.player, `<span class="num">${f1(x.pts * (x.player.player_id === r.dream.captain ? S.rules.captain_multiplier : 1))}</span>${x.player.player_id === r.dream.captain ? ' <span class="cap">C</span>' : ''}`)).join('')}${r.dream.coach ? crow(r.dream.coach.coach, `<span class="num">${f1(r.dream.coach.pts)}</span>`) : ''}</div><p class="small muted">Custo ${f1(r.dream.cost)} cr</p></div></div>

  function matchBlock(m) {
    const A = S.teams[m.team_a], B = S.teams[m.team_b], scored = S.validation.processable.has(m.id);
    const st = scored ? '<span class="tag ok">pontuada</span>' : m.status === 'finished' ? '<span class="tag warn">finalizada · sem stats importadas</span>' : m.status === 'incomplete' ? '<span class="tag err">status não confirmado</span>' : '<span class="tag">agendada</span>';

      ${S.playerMatch.filter(x => x.match_id === m.id).sort((a, b) => (a.team_id === m.team_a ? 0 : 1) - (b.team_id === m.team_a ? 0 : 1) || b.total - a.total).map(x => { const s = x.maps.find(z => z.map_no === mp.map_no).stats;
        return `<tr><td><a href="${plink(S.byId[x.player_id])}">${esc(s.nick)}</a> <span class="sub">${esc(S.teams[x.team_id].short)}</span></td><td class="r">${s.kills}-${s.deaths}</td><td class="r">${s.entry_kills}-${s.entry_deaths}</td><td class="r">${s.kost}%</td><td class="r">${s.clutches}</td><td class="r">${s.multikills}</td><td class="r">${s.objectives}</td><td class="r">${s.trade_kills}</td><td class="r">${s.eps}</td><td class="r"><b>${f1(x.total)}</b></td></tr>`; }).join('')}</tbody></table></div>`).join('')}

  }

  let rankMode = 'geral';
  function ranking() {
    const scored = S.rounds.filter(r => r.ranked.length);
    const all = USERS.concat([{ id: 'me', name: 'Você', team_name: lineup.team_name || 'Meu time', lineups: snapshots }]);
    const rd = rankMode === 'geral' ? null : +rankMode;
    const lb = E.leaderboard(all, S, rd);
    return `<h2>Ranking</h2><div class="notice">Usuários e times fantasy abaixo são contas de demonstração. As pontuações vêm de estatísticas reais dos atletas.</div>
      <div class="chips"><button class="chip ${rankMode === 'geral' ? 'on' : ''}" data-rank="geral">Geral</button>${scored.map(r => `<button class="chip ${rankMode == r.round ? 'on' : ''}" data-rank="${r.round}">Rodada ${r.round}</button>`).join('')}</div>

      ${lb.map(x => `<tr ${x.user.id === 'me' ? 'style="background:var(--accent-soft)"' : ''}><td>${x.pos}</td><td>${esc(x.user.name)} ${x.user.mock ? '<span class="tag">demo</span>' : ''}</td><td>${esc(x.user.team_name)}</td><td class="r"><b>${f1(x.pts)}</b></td></tr>`).join('')}</tbody></table></div>`;
  }

  function player(id) {
    const p = S.byId[id]; if (!p) return '<p>Jogador não encontrado.</p>';
    const rds = S.rounds.filter(r => r.ranked.length).map(r => ({ r: r.round, v: p.byRound[r.round] }));
    const mx = Math.max(1, ...rds.map(x => Math.abs(x.v || 0)));
    const st = p.stats;
    const sel = lineup.players.includes(p.player_id), locked = !!marketState().locked;
    return `<div class="profile-head">${ava(p, 84)}<div><h1>${esc(p.nickname)}</h1><div class="muted">${p.real_name ? esc(p.real_name) : 'Nome real não informado na fonte oficial'}</div><div>${badge(p.team, 20)} ${esc(p.team.name)}${p.role ? ' · ' + esc(p.role) : ''}</div></div></div>
      <div class="kpis"><div class="kpi"><b>${f1(p.price)} cr</b><span>Preço ${fmtDelta(p.price_change)}</span></div><div class="kpi"><b>${f1(p.total)}</b><span>Fantasy Points totais</span></div><div class="kpi"><b>${f1(p.avg)}</b><span>Média por partida</span></div><div class="kpi"><b>${p.games}</b><span>Partidas pontuadas</span></div></div>
      <div style="margin:14px 0"><button class="btn ${sel ? '' : 'primary'}" data-toggle="${p.player_id}" ${locked ? 'disabled' : ''}>${sel ? 'Remover do time' : 'Adicionar ao time'}</button></div>
      <h2>Forma recente</h2><div class="panel"><div class="spark">${rds.map(x => x.v == null ? `<div><b class="muted">–</b><i style="height:2px;background:var(--line)"></i><span>R${x.r}</span></div>` : `<div><b>${f1(x.v)}</b><i class="${x.v < 0 ? 'neg' : ''}" style="height:${Math.abs(x.v) / mx * 80}%"></i><span>R${x.r}</span></div>`).join('')}</div></div>
      <h2>Estatísticas na SAL</h2><div class="statgrid">${[['Kills', st.kills], ['Deaths', st.deaths], ['KD', st.kd.toFixed(2).replace('.', ',')], ['Entry', `${st.entry_kills}-${st.entry_deaths}`], ['KOST', st.kost == null ? '–' : Math.round(st.kost) + '%'], ['KPR', st.kpr.toFixed(2).replace('.', ',')],
        ['Clutches', st.clutches], ['Multikills', st.multikills], ['Objectives', st.objectives], ['Trade kills', st.trade_kills], ['HS', st.hs == null ? '–' : Math.round(st.hs) + '%'], ['EPS médio', st.eps == null ? '–' : Math.round(st.eps)]].map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
      <h2>Histórico Fantasy</h2>${p.matches.slice().reverse().map(x => { const o = S.teams[x.opp];
        return `<details class="match" open><summary><span class="grow"><b>R${x.round}</b> vs ${badge(o, 18)} ${esc(o.name)} · <span class="${x.won ? 'up' : 'down'}">${x.won ? 'Vitória' : 'Derrota'} ${x.score_str}</span></span><span class="c" style="font-size:22px;font-weight:700">${f1(x.total)}</span></summary><div class="body">
        ${x.maps.map(mp => calcTable(mp, x)).join('')}<p class="small muted"><a href="${S.normalized.matches.find(m => m.id === x.match_id).source_url}" target="_blank" rel="noopener">Ver partida na fonte oficial</a></p></div></details>`; }).join('') || '<p class="muted">Sem partidas pontuadas.</p>'}
      <p class="small muted">Fonte: ${esc(p.source)}. ${p.photo_missing ? 'Foto oficial: indisponível (avatar padrão).' : `Foto: <a href="${p.photo_source_url}" target="_blank" rel="noopener">${esc(p.photo_source)}</a>.`}</p>`;
  }
  function coachView(id) {
    const c = S.coachById[id]; if (!c) return '<p>Coach não encontrado.</p>';
    const rds = S.rounds.filter(r => r.ranked.length).map(r => ({ r: r.round, v: c.byRound[r.round] }));
    const mx = Math.max(1, ...rds.map(x => Math.abs(x.v || 0)));
    const sel = lineup.coach === c.coach_id, locked = !!marketState().locked;
    const allAvg = E.mean(S.coaches.map(x => x.avg));
    return `<div class="profile-head">${ava(c, 84)}<div><h1>${esc(c.nickname)} <span class="ctag" style="font-size:14px">Coach</span></h1><div>${badge(c.team, 20)} ${esc(c.team.name)}</div><div class="muted small">No cargo desde ${new Date(c.joined_at).toLocaleDateString('pt-BR')}</div></div></div>
      <div class="kpis"><div class="kpi"><b>${f1(c.price)} cr</b><span>Preço ${fmtDelta(c.price_change)}</span></div><div class="kpi"><b>${f1(c.avg)}</b><span>Nota média (${c.rank_avg}º de ${S.coaches.length})</span></div><div class="kpi"><b>${f1(c.total)}</b><span>Fantasy Points totais</span></div><div class="kpi"><b>${c.games}</b><span>Partidas pontuadas</span></div></div>
      <div style="margin:14px 0"><button class="btn ${sel ? '' : 'primary'}" data-coach="${c.coach_id}" ${locked ? 'disabled' : ''}>${sel ? 'Remover do time' : lineup.coach ? 'Escalar no lugar do coach atual' : 'Escalar como coach'}</button></div>
      <div class="notice">Nota do coach em cada partida = soma dos Fantasy Points dos jogadores da ${esc(c.team.name)} ÷ ${S.rules.squad_size}. Inclui o bônus de vitória que cada jogador recebe; não recebe multiplicador de capitão.</div>
      <h2>Forma recente</h2><div class="panel"><div class="spark">${rds.map(x => x.v == null ? `<div><b class="muted">–</b><i style="height:2px;background:var(--line)"></i><span>R${x.r}</span></div>` : `<div><b>${f1(x.v)}</b><i class="${x.v < 0 ? 'neg' : ''}" style="height:${Math.abs(x.v) / mx * 80}%"></i><span>R${x.r}</span></div>`).join('')}</div></div>
      <h2>Análise Fantasy</h2><div class="statgrid">${[['Campanha', `${c.wins}V-${c.losses}D`], ['Nota em vitórias', c.avg_win == null ? '–' : f1(c.avg_win)], ['Nota em derrotas', c.avg_loss == null ? '–' : f1(c.avg_loss)],
        ['Melhor nota', c.best ? f1(c.best.total) + ` <span class="sub">R${c.best.round}</span>` : '–'], ['Pior nota', c.worst ? f1(c.worst.total) + ` <span class="sub">R${c.worst.round}</span>` : '–'], ['Desvio padrão', c.sd == null ? '–' : f1(c.sd)],
        ['Forma (últ. ' + S.rules.form_window + ')', f1(c.form)], ['vs média dos coaches', `<b class="${c.avg >= allAvg ? 'up' : 'down'}">${c.avg >= allAvg ? '+' : ''}${f1(c.avg - allAvg)}</b>`], ['Custo por ponto', c.avg > 0 ? f1(c.price / c.avg) + ' cr' : '–']].map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
      <h2>Quem puxa a nota</h2><div class="panel"><p class="small muted" style="margin-top:0">Participação de cada jogador na soma de pontos do time nas partidas deste coach.</p><div class="contrib">${c.contributions.map(o => { const p = S.byId[o.player_id];
        return `<a href="${plink(p)}" style="display:flex;align-items:center;gap:8px;text-decoration:none">${ava(p, 26)}<b>${esc(p.nickname)}</b> <span class="sub">${o.games} partidas · média ${f1(o.avg)}</span></a><b class="c" style="font-size:18px">${Math.round(o.share * 100)}%</b><div class="b"><i style="width:${Math.max(0, o.share * 100)}%"></i></div>`; }).join('')}</div></div>
      <h2>Histórico de notas</h2>${c.matches.slice().reverse().map(x => { const o = S.teams[x.opp];
        return `<details class="match"><summary><span class="grow"><b>R${x.round}</b> vs ${badge(o, 18)} ${esc(o.name)} · <span class="${x.won ? 'up' : 'down'}">${x.won ? 'Vitória' : 'Derrota'} ${x.score_str}</span></span><span class="c" style="font-size:22px;font-weight:700">${f1(x.total)}</span></summary><div class="body"><div class="calc"><table>
        ${x.players.map(p => `<tr><td><a href="${plink(S.byId[p.player_id])}">${esc(S.byId[p.player_id].nickname)}</a></td><td style="text-align:right">${f1(p.total)}</td></tr>`).join('')}
        <tr class="tot"><td>Soma do time</td><td style="text-align:right">${f1(x.sum)}</td></tr><tr class="tot"><td>Nota do coach (÷ ${x.divisor})</td><td style="text-align:right">${f1(x.total)}</td></tr></table></div>
        <p class="small muted"><a href="${S.normalized.matches.find(m => m.id === x.match_id).source_url}" target="_blank" rel="noopener">Ver partida na fonte oficial</a></p></div></details>`; }).join('') || '<p class="muted">Sem partidas pontuadas.</p>'}
      <p class="small muted">Fonte: <a href="${c.source_url}" target="_blank" rel="noopener">${esc(c.source)}</a>. Foto oficial do elenco.</p>`;
  }
  function calcTable(mp, x) {
    return `<div class="calc"><div><b>${esc(mp.map)}</b> · K-D ${mp.stats.kills}-${mp.stats.deaths} · KOST ${mp.stats.kost}% · EPS ${mp.stats.eps}</div><table>
      ${mp.score.items.filter(i => i.qty !== 0 || i.qty === null).map(i => `<tr><td>${esc(i.label)}</td><td>${i.qty == null ? '' : i.qty + ' × ' + f1(i.w)}</td><td style="text-align:right">${i.pts >= 0 ? '+' : ''}${f1(i.pts)}</td></tr>`).join('')}
      ${x.maps.length === 1 || mp.map_no === x.maps[x.maps.length - 1].map_no ? `<tr><td>Vitória na partida</td><td></td><td style="text-align:right">+${f1(x.win)}</td></tr><tr class="tot"><td>Total da partida</td><td></td><td style="text-align:right">${f1(x.total)}</td></tr>` : ''}</table></div>`;

  function report() {
    const done = S.normalized.matches.filter(m => S.validation.processable.has(m.id));
    const top = S.players.slice().sort((a, b) => b.total - a.total).slice(0, 20);
    const pm = S.playerMatch.slice().sort((a, b) => b.total - a.total);
    const cons = S.players.filter(p => p.games >= 2 && p.avg > 0).sort((a, b) => a.sd / a.avg - b.sd / b.avg)[0];
    const val = S.players.slice().sort((a, b) => b.price_change - a.price_change)[0];
    const xs = S.players.map(p => p.stats.eps), ys = S.players.map(p => p.avg), mx = E.mean(xs), my = E.mean(ys);
    const corr = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / Math.sqrt(xs.reduce((s, x) => s + (x - mx) ** 2, 0) * ys.reduce((s, y) => s + (y - my) ** 2, 0));
    const aud = S.playerMatch.find(x => x.match_id === 8582 && S.byId[x.player_id].nickname === 'romeo') || pm[0];
    return `<h2>Relatório do teste da temporada</h2>${coverage()}
      <div class="kpis"><div class="kpi"><b>${done.length}</b><span>Partidas importadas</span></div><div class="kpi"><b>${S.normalized.maps.filter(m => S.validation.processable.has(m.match_id)).length}</b><span>Mapas</span></div><div class="kpi"><b>${S.players.length}</b><span>Jogadores</span></div><div class="kpi"><b>${corr.toFixed(2).replace('.', ',')}</b><span>Correlação EPS × média FP</span></div></div>
      <h2>Top 20 jogadores</h2><div class="panel scroll"><table class="tbl"><thead><tr><th>#</th><th>Jogador</th><th>Equipe</th><th class="r">Partidas</th><th class="r">FP</th><th class="r">Média</th><th class="r">Preço</th></tr></thead><tbody>
      ${top.map((p, i) => `<tr><td>${i + 1}</td><td><a href="${plink(p)}">${esc(p.nickname)}</a></td><td>${esc(p.team.name)}</td><td class="r">${p.games}</td><td class="r"><b>${f1(p.total)}</b></td><td class="r">${f1(p.avg)}</td><td class="r">${f1(p.price)}</td></tr>`).join('')}</tbody></table></div>
      <h2>Coaches</h2><div class="panel scroll"><table class="tbl"><thead><tr><th>#</th><th>Coach</th><th>Equipe</th><th class="r">Partidas</th><th class="r">V-D</th><th class="r">Nota média</th><th class="r">Total</th><th class="r">Preço</th></tr></thead><tbody>
      ${S.coaches.slice().sort((a, b) => b.avg - a.avg).map((c, i) => `<tr><td>${i + 1}</td><td><a href="${clink(c)}">${esc(c.nickname)}</a></td><td>${esc(c.team.name)}</td><td class="r">${c.games}</td><td class="r">${c.wins}-${c.losses}</td><td class="r"><b>${f1(c.avg)}</b></td><td class="r">${f1(c.total)}</td><td class="r">${f1(c.price)}</td></tr>`).join('')}</tbody></table></div>
      <h2>Destaques</h2><div class="grid g2"><div class="panel list">
        <div class="row"><span class="grow">Maior pontuação em uma partida</span><b>${esc(S.byId[pm[0].player_id].nickname)} · ${f1(pm[0].total)}</b></div>
        <div class="row"><span class="grow">Menor pontuação</span><b>${esc(S.byId[pm.at(-1).player_id].nickname)} · ${f1(pm.at(-1).total)}</b></div>
        <div class="row"><span class="grow">Mais consistente (menor variação relativa)</span><b>${cons ? esc(cons.nickname) + ' · σ ' + f1(cons.sd) : '–'}</b></div>
        <div class="row"><span class="grow">Mais valorizado na última rodada</span><b>${esc(val.nickname)} ${fmtDelta(val.price_change)}</b></div></div>
      <div class="panel"><h3>Auditoria: ${esc(S.byId[aud.player_id].nickname)} na partida ${aud.match_id}</h3>${aud.maps.map(mp => calcTable(mp, aud)).join('')}<p class="small muted">O mesmo valor aparece no perfil do jogador e no resultado da rodada, porque todas as telas leem o mesmo cálculo.</p></div></div>
      ${S.rounds.filter(r => r.ranked.length).map(r => `<h2>Rodada ${r.round}</h2><div class="grid g2"><div class="panel"><h3>Top 5</h3><div class="list">${r.ranked.slice(0, 5).map((x, i) => prow(x.player, `<span class="num">${f1(x.pts)}</span>`, i + 1)).join('')}</div></div>
        <div class="panel"><h3>Time ideal · ${f1(r.dream.total)} pts</h3><div class="list">${r.dream.picks.map(x => prow(x.player, `<span class="num">${f1(x.pts)}</span>${x.player.player_id === r.dream.captain ? ' <span class="cap">C</span>' : ''}`)).join('')}${r.dream.coach ? crow(r.dream.coach.coach, `<span class="num">${f1(r.dream.coach.pts)}</span>`) : ''}</div></div></div>`).join('')}`;
  }

  function admin() {
    const ms = S.normalized.matches, fin = ms.filter(m => m.stage_phase === 'group');
    const pend = fin.filter(m => !S.validation.processable.has(m.id));
    const R = S.rules;
    const w = [['kill', 'Kill'], ['death', 'Death'], ['entry_kill', 'Entry kill'], ['entry_death', 'Entry death'], ['clutch', 'Clutch'], ['multikill', 'Multikill'], ['objective', 'Objective'], ['trade_kill', 'Trade kill'], ['victory_bonus', 'Bônus vitória'], ['captain_multiplier', 'Mult. capitão'],
      ['budget', 'Orçamento'], ['max_per_team', 'Máx. por time'], ['coach_price_min', 'Coach preço mín.'], ['coach_price_max', 'Coach preço máx.'], ['price_change_cap', 'Teto de variação'], ['min_games_for_price', 'Jogos mín. p/ preço'], ['form_window', 'Janela de forma']];
    return `<h2>Painel de administração</h2>
      <div class="notice">${RT.shared ? (RT.owner ? 'Conectado ao banco do artefato. Pesos e importações valem para todos que abrirem este link.' : 'Somente o dono do artefato grava pesos e importações. Suas alterações valem só neste navegador.') : 'Banco do artefato indisponível nesta visualização. Alterações ficam salvas apenas neste navegador.'}</div>
      <div class="kpis"><div class="kpi"><b>${S.validation.processable.size}</b><span>Partidas pontuadas</span></div><div class="kpi"><b>${pend.length}</b><span>Fase de grupos pendente</span></div><div class="kpi"><b>${S.players.filter(p => p.photo_missing).length}</b><span>Jogadores sem foto</span></div><div class="kpi"><b>${S.validation.issues.length}</b><span>Alertas de validação</span></div></div>
      <h2>Sincronização</h2><div class="panel small"><p>Coleta da fonte oficial: <b>${dt(DATA.meta.collected_at)}</b> · ${esc(DATA.meta.primary_source)} · <a href="${DATA.meta.stage_url}" target="_blank" rel="noopener">competição</a></p>
        <div class="list">${syncLog.slice(0, 6).map(l => `<div class="row"><span class="tag ${l.level === 'error' ? 'err' : ''}">${esc(l.level)}</span><span class="grow">${esc(l.msg)}</span><span class="muted">${new Date(l.at).toLocaleTimeString('pt-BR')}</span></div>`).join('')}</div></div>
      <h2>Regras de pontuação</h2><div class="panel"><div class="weights">${w.map(([k, l]) => `<label class="field">${l}<input type="number" step="0.1" data-rule="${k}" value="${R[k]}"></label>`).join('')}</div>
        <p class="small muted" style="margin-top:10px">KOST: ${R.kost_tiers.map(t => `≥${t.min}% → ${t.pts > 0 ? '+' : ''}${t.pts}`).join(' · ')}</p>
        <label class="field" style="max-width:520px">Faixas de KOST (min:pontos, separadas por vírgula)<input data-kost value="${R.kost_tiers.map(t => t.min + ':' + t.pts).join(', ')}"></label>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn primary" id="recalc">Recalcular temporada</button><button class="btn" id="resetRules">Restaurar padrão</button></div></div>
      <h2>Importar partida da fonte oficial</h2><div class="panel"><p class="small muted">Abra a página da partida no site oficial, copie a tabela de cada equipe e cole abaixo. O sistema valida antes de pontuar. Reimportar a mesma partida substitui os dados, sem duplicar.</p>
        <div class="grid g2"><label class="field">Partida<select id="impMatch">${ms.filter(m => m.team_a && m.team_b).map(m => `<option value="${m.id}">${m.id} · R${m.round} · ${esc(S.teams[m.team_a].short)} x ${esc(S.teams[m.team_b].short)}${S.validation.processable.has(m.id) ? ' (já importada)' : ''}</option>`).join('')}</select></label>
        <label class="field">Mapa (nº e nome)<span style="display:flex;gap:6px"><input id="impMapNo" type="number" value="1" style="max-width:70px"><input id="impMap" placeholder="ex.: Clubhouse"></span></label>
        <label class="field">Placar do mapa<span style="display:flex;gap:6px"><input id="impSa" type="number" placeholder="A"><input id="impSb" type="number" placeholder="B"></span></label><span></span>
        <label class="field">Tabela da equipe A<textarea id="impA" rows="5"></textarea></label><label class="field">Tabela da equipe B<textarea id="impB" rows="5"></textarea></label></div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="impGo">Importar e recalcular</button><span id="impMsg" class="small"></span></div></div>
      <h2>Partidas</h2><div class="panel scroll"><table class="tbl"><thead><tr><th>ID</th><th>Rodada</th><th>Confronto</th><th>Status fonte</th><th>Fantasy</th></tr></thead><tbody>
        ${ms.map(m => `<tr><td><a href="${m.source_url}" target="_blank" rel="noopener">${m.id}</a></td><td>R${m.round}</td><td>${esc(S.teams[m.team_a] ? S.teams[m.team_a].short : '?')} ${m.score_a != null ? m.score_a + ':' + m.score_b : 'x'} ${esc(S.teams[m.team_b] ? S.teams[m.team_b].short : '?')}</td><td>${esc(m.status)}</td><td>${S.validation.processable.has(m.id) ? '<span class="tag ok">pontuada</span>' : m.status === 'finished' ? '<span class="tag warn">importar</span>' : '<span class="tag">—</span>'}</td></tr>`).join('')}</tbody></table></div>
      <h2>Qualidade dos dados</h2><div class="panel small list">${S.validation.issues.map(i => `<div class="row"><span class="tag ${i.level === 'error' ? 'err' : 'warn'}">${i.level}</span><span class="grow">${esc(i.msg)}</span></div>`).join('') || '<p class="up">Nenhuma inconsistência nas partidas importadas.</p>'}
        <div class="row"><span class="grow">Conflitos entre fontes (data_conflicts)</span><b>${DATA.data_conflicts.length}</b></div>
        <div class="row"><span class="grow">Jogadores sem equipe</span><b>${S.players.filter(p => !p.team).length}</b></div>
        <div class="row"><span class="grow">Logos oficiais pendentes</span><b>${Object.values(S.teams).filter(t => t.logo_missing).length}</b></div>
        <div class="row"><span class="grow">Coaches cadastrados · sem foto</span><b>${S.coaches.length} · ${S.coaches.filter(c => c.photo_missing).length}</b></div>
        <div class="row"><span class="grow">Jogadores sem foto · sem nome real · sem role</span><b>${S.players.filter(p => p.photo_missing).length} · ${S.players.filter(p => !p.real_name).length} · ${S.players.filter(p => !p.role).length}</b></div></div>
      <h2>Relógio de teste</h2><div class="panel"><p class="small muted">Simula outro horário para testar fechamento do mercado e snapshot. Hoje: ${now().toLocaleString('pt-BR')}${clock ? ' (simulado)' : ''}.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="datetime-local" id="clk" class="field" style="padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"><button class="btn" id="clkSet">Aplicar</button><button class="btn" id="clkReal">Usar relógio real</button></div></div>`;
  }

  /* ---------- roteador e eventos ---------- */
  const views = { '': home, mercado: market, time: team, rodadas: roundsView, ranking, relatorio: report, admin };
  let swapOut = null;
  function route() {
    const h = location.hash.replace(/^#\/?/, ''), [a, b] = h.split('/');
    $('#app').innerHTML = a === 'jogador' ? player(b) : a === 'coach' ? coachView(b) : (views[a] || home)();
    document.querySelectorAll('nav a').forEach(x => x.classList.toggle('on', x.getAttribute('href') === '#/' + (a || '')));
    tick(); try { window.scrollTo(0, 0); } catch (e) { }
  }
  function tick() {
    const el = $('#countdown'); if (!el) return;
    const ms = Math.max(0, new Date(el.dataset.lock) - now()); const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
    el.innerHTML = [[d, 'dias'], [h, 'horas'], [m, 'min'], [s, 'seg']].map(([v, l]) => `<div><b>${String(v).padStart(2, '0')}</b><span>${l}</span></div>`).join('');
    if (ms === 0) { lockCheck(); route(); }
  }
  setInterval(tick, 1000);
  function togglePlayer(id) {
    if (marketState().locked) return toast('Mercado fechado');
    const i = lineup.players.indexOf(id);
    if (i >= 0) { lineup.players.splice(i, 1); if (lineup.captain === id) lineup.captain = null; }
    else {
      if (swapOut) { const j = lineup.players.indexOf(swapOut); if (j >= 0) { lineup.players[j] = id; if (lineup.captain === swapOut) lineup.captain = id; } swapOut = null; }
      else if (lineup.players.length >= S.rules.squad_size) return toast(`Time completo. Remova alguém antes.`);
      else lineup.players.push(id);
      const p = S.byId[id], same = lineup.players.filter(x => S.byId[x].team_id === p.team_id).length;
      if (same > S.rules.max_per_team) toast(`Atenção: ${same} jogadores da ${p.team.name} (máx. ${S.rules.max_per_team})`);
    }
    lineup.saved_at = null; LS.set('lineup', lineup);
  }
  function toggleCoach(id) {
    if (marketState().locked) return toast('Mercado fechado');
    lineup.coach = lineup.coach === id ? null : id; lineup.saved_at = null; LS.set('lineup', lineup);
    if (lineup.coach) toast(`${S.coachById[id].nickname} escalado como coach`);
  }
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-coach],[data-kind],[data-kind-go],[data-toggle],[data-cap],[data-swap],[data-round],[data-rank],[data-sim],[data-go],#confirm,#recalc,#resetRules,#impGo,#clkSet,#clkReal,#theme');
    if (!t) return;
    if (t.dataset.coach) { toggleCoach(t.dataset.coach); if ($('#cards')) $('#cards').innerHTML = marketCards(); else route(); }
    else if (t.dataset.kind) { mf.kind = t.dataset.kind; mf.sort = 'price_desc'; route(); }
    else if (t.dataset.kindGo) { mf.kind = t.dataset.kindGo; }
    else if (t.dataset.go) location.hash = t.dataset.go;
    else if (t.dataset.toggle) { togglePlayer(t.dataset.toggle); if ($('#cards')) $('#cards').innerHTML = marketCards(); else route(); }
    else if (t.dataset.cap) { lineup.captain = t.dataset.cap; lineup.saved_at = null; LS.set('lineup', lineup); route(); }
    else if (t.dataset.swap) { swapOut = t.dataset.swap; toast('Escolha o substituto no mercado'); }
    else if (t.dataset.round) { selRound = +t.dataset.round; route(); }
    else if (t.dataset.rank) { rankMode = t.dataset.rank; route(); }
    else if (t.dataset.sim) { $('#sim').innerHTML = resultBlock({ players: lineup.players, captain: lineup.captain, coach: lineup.coach }, +t.dataset.sim, `Simulação · Rodada ${t.dataset.sim}`); }
    else if (t.id === 'confirm') { const c = chk(); if (!c.ok || marketState().locked) return; lineup.saved_at = now().toISOString(); await saveLineup(); toast('Escalação confirmada'); route(); }
    else if (t.id === 'recalc') {
      const nr = { ...S.rules }; document.querySelectorAll('[data-rule]').forEach(i => nr[i.dataset.rule] = parseFloat(String(i.value).replace(',', '.')));
      const kt = $('[data-kost]').value.split(',').map(x => x.split(':').map(Number)).filter(a => a.length === 2 && !a.some(isNaN)).map(([min, pts]) => ({ min, pts })).sort((a, b) => b.min - a.min);
      if (kt.length) nr.kost_tiers = kt; rules = nr; await saveRules(); recalc('Recalcular temporada (admin)'); toast('Temporada recalculada'); route();
    }
    else if (t.id === 'resetRules') { rules = null; await saveRules(); recalc('Regras restauradas'); route(); }
    else if (t.id === 'impGo') {
      const mid = +$('#impMatch').value, m = S.normalized.matches.find(x => x.id === mid), msg = $('#impMsg');
      const A = E.parseStatsPaste($('#impA').value), B = E.parseStatsPaste($('#impB').value);
      const sa = +$('#impSa').value, sb = +$('#impSb').value, mapName = $('#impMap').value.trim(), mapNo = +$('#impMapNo').value || 1;
      if (A.length !== 5 || B.length !== 5) { msg.innerHTML = `<span class="down">Encontrei ${A.length} e ${B.length} jogadores. Cada tabela precisa ter 5 linhas.</span>`; return; }
      if (!mapName || isNaN(sa) || isNaN(sb) || sa === sb) { msg.innerHTML = '<span class="down">Informe o nome do mapa e o placar (sem empate).</span>'; return; }
      if (m.status !== 'finished') { msg.innerHTML = `<span class="down">Partida com status "${esc(m.status)}" não pode ser processada.</span>`; return; }
      const prev = imports.find(x => x.match_id === mid); const keepMaps = prev ? prev.maps.filter(x => x.map_no !== mapNo) : [];
      const keepStats = prev ? prev.stats.filter(x => x.map_no !== mapNo) : [];
      const src = { source: 'R6 Esports (Ubisoft) — colagem manual', source_url: m.source_url, collected_at: new Date().toISOString() };
      const imp = { match_id: mid, ...src, maps: keepMaps.concat([{ map_no: mapNo, map: mapName, team_a: m.team_a, team_b: m.team_b, score_a: sa, score_b: sb, ...src }]),
        stats: keepStats.concat(A.map(s => ({ ...s, map_no: mapNo, team_id: m.team_a })), B.map(s => ({ ...s, map_no: mapNo, team_id: m.team_b }))) };
      await saveImport(imp); recalc(`Importação da partida ${mid}`);
      const errs = S.validation.issues.filter(i => i.match === mid);
      toast(S.validation.processable.has(mid) ? `Partida ${mid} pontuada` : `Partida ${mid} importada com erros`); route();
    }
    else if (t.id === 'clkSet') { const v = $('#clk').value; if (v) { clock = new Date(v).toISOString(); LS.set('clock', clock); lockCheck(); route(); } }
    else if (t.id === 'clkReal') { clock = null; LS.set('clock', null); route(); }
    else if (t.id === 'theme') { const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; LS.set('theme', r.dataset.theme); }
  });
  document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.mf; if (!k) return; mf[k] = e.target.value; $('#cards').innerHTML = marketCards(); });
  document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.mf; if (!k) return; mf[k] = e.target.value; $('#cards').innerHTML = marketCards(); });
  window.addEventListener('hashchange', route);
  const th = LS.get('theme', null); if (th) document.documentElement.dataset.theme = th;
  recalc('Carga inicial'); route(); initRuntime();
})();
</script></body></html>
